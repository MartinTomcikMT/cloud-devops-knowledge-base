<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud / DevOps Knowledge Base</title>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #374151;
      --accent: #38bdf8;
      --accent2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --card: #020617;
      --code: #0b1220;
      --shadow: 0 14px 40px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(56,189,248,.13), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(34,197,94,.09), transparent 25%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .wrap {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
    }

    .hero {
      position: relative;
      min-height: 390px;
      display: flex;
      align-items: center;
      z-index: 1;
      padding: 50px 24px 40px;
      border-bottom: 1px solid rgba(56,189,248,.26);
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.46);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("./devops-hero2.png") right center / cover no-repeat;
      z-index: -1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 34%, rgba(56,189,248,.22), transparent 30%),
        radial-gradient(circle at 82% 28%, rgba(34,197,94,.13), transparent 26%),
        linear-gradient(180deg, transparent 0%, rgba(15,23,42,.94) 100%);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      margin: 0 0 12px;
    }

    .hero-title {
      padding: 0;
      border: 0;
      background: transparent;
      color: #e0f7ff;
      font-size: clamp(34px, 5.6vw, 76px);
      font-weight: 950;
      letter-spacing: -0.065em;
      line-height: .95;
      text-align: left;
      cursor: pointer;
      text-shadow:
        0 0 12px rgba(56,189,248,.64),
        0 0 34px rgba(56,189,248,.38),
        0 0 76px rgba(34,197,94,.18);
    }

    .hero-title:hover {
      color: #ffffff;
      filter: drop-shadow(0 0 18px rgba(56,189,248,.48));
    }

    .hero-subtitle {
      margin: 0;
      max-width: 920px;
      color: #dbeafe;
      font-size: clamp(15px, 1.5vw, 18px);
      text-shadow: 0 1px 16px rgba(0,0,0,.8);
    }

    main.app-layout {
      padding: 24px 0 64px;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 230px;
      gap: 18px;
      align-items: start;
    }

    .side-panel,
    .center-panel {
      min-width: 0;
    }

    .panel-card {
      border: 1px solid var(--line);
      background: rgba(17,24,39,.86);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .sticky-panel {
      position: sticky;
      top: 18px;
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 14px;
      color: #bfdbfe;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .menu-title {
      margin-top: 18px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    input,
    textarea,
    select {
      width: 100%;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,.14);
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 14px;
      transition: .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .primary {
      background: linear-gradient(135deg, #0284c7, #16a34a);
      border: 0;
      font-weight: 700;
    }

    .danger {
      border-color: rgba(239,68,68,.45);
      color: #fecaca;
      background: rgba(239,68,68,.12);
    }

    .left-panel input,
    .left-panel select {
      margin-bottom: 10px;
    }

    .side-nav {
      margin: 0;
      display: grid;
      gap: 7px;
      padding-top: 0;
      border-top: 0;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 9px 11px;
      border-radius: 11px;
      color: var(--muted);
      background: rgba(31,41,55,.75);
    }

    .nav-btn.active {
      color: #02131f;
      background: linear-gradient(135deg, #38bdf8, #22c55e);
      border-color: transparent;
      font-weight: 850;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 0;
    }

    .stat {
      border: 1px solid var(--line);
      background: rgba(2,6,23,.62);
      border-radius: 15px;
      padding: 13px;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: white;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      margin: 0 0 28px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -0.02em;
    }

    .section-desc {
      margin: 4px 0 0;
      color: var(--muted);
      max-width: 850px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    details.card {
      border: 1px solid var(--line);
      background: rgba(2,6,23,.78);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    details.card[open] {
      border-color: rgba(56,189,248,.55);
    }

    summary {
      list-style: none;
      cursor: pointer;
      padding: 15px 16px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .title strong {
      font-size: 17px;
    }

    .tagline {
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      white-space: nowrap;
      font-size: 12px;
      color: #bae6fd;
      border: 1px solid rgba(56,189,248,.35);
      background: rgba(56,189,248,.08);
      padding: 5px 9px;
      border-radius: 999px;
    }

    .content {
      border-top: 1px solid var(--line);
      padding: 15px 16px 17px;
      background: rgba(15,23,42,.56);
    }

    .block {
      margin: 0 0 15px;
    }

    .block h3 {
      margin: 0 0 7px;
      font-size: 14px;
      color: #bfdbfe;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .block p {
      margin: 0;
      color: #d1d5db;
    }

    ul {
      margin: 8px 0 0 20px;
      padding: 0;
    }

    li {
      margin: 5px 0;
    }

    code {
      background: var(--code);
      color: #a7f3d0;
      border: 1px solid rgba(167,243,208,.18);
      border-radius: 6px;
      padding: 2px 5px;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
    }

    .questions li {
      color: #fef3c7;
    }

    .tracker {
      border: 1px solid var(--line);
      background: rgba(17,24,39,.86);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-top: 28px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr .6fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0 0;
    }

    .question-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .saved-q {
      border: 1px solid var(--line);
      background: rgba(2,6,23,.64);
      border-radius: 14px;
      padding: 13px;
    }

    .saved-q header {
      position: static;
      padding: 0;
      border: 0;
      background: transparent;
      backdrop-filter: none;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .saved-q h3 {
      margin: 0;
      font-size: 16px;
    }

    .saved-q .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .saved-q p {
      margin: 9px 0 0;
      color: #d1d5db;
      white-space: pre-wrap;
    }

    .empty {
      color: var(--muted);
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      text-align: center;
    }

    @media (max-width: 1180px) {
      .app-layout {
        grid-template-columns: 230px minmax(0, 1fr);
      }

      .right-panel {
        display: none;
      }
    }

    @media (max-width: 820px) {
      .hero {
        min-height: 300px;
        padding: 38px 18px 32px;
        background-position: 63% center;
      }

      .app-layout {
        grid-template-columns: 1fr;
      }

      .sticky-panel {
        position: static;
      }

      .side-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-btn {
        width: auto;
        text-align: center;
        border-radius: 999px;
      }

      .right-panel {
        display: block;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .summary-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .badge {
        white-space: normal;
      }
    }

    @media print {
      body {
        background: white;
        color: black;
      }

      .hero,
      .left-panel,
      .right-panel,
      .tracker {
        display: none;
      }

      .app-layout {
        display: block;
      }

      details.card {
        break-inside: avoid;
        border-color: #bbb;
        background: white;
        box-shadow: none;
      }

      details.card:not([open]) .content {
        display: block;
      }

      .content {
        background: white;
      }

      .badge,
      .tagline,
      .section-desc {
        color: #333;
      }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="hero-overlay"></div>

    <div class="wrap hero-inner">
      <h1>
        <button id="homeReset" class="hero-title">
          Cloud / DevOps <br>Knowledge Base
        </button>
      </h1>

      <p class="hero-subtitle">
        Overview for Azure, AWS, CI/CD, Terraform, Kubernetes, Docker,<br>
        Windows, Linux, Networking, Git and common DevOps interview topics.
      </p>
    </div>
  </header>

  <main class="wrap app-layout">
    <aside class="side-panel left-panel">
      <div class="panel-card sticky-panel">
        <h2 class="panel-title">Search</h2>

        <input id="search" placeholder="Search for AKS, IAM, subnet, Dockerfile..." />

        <select id="openMode">
          <option value="normal">Clickable cards</option>
          <option value="open">Open all</option>
          <option value="closed">Close all</option>
        </select>

        <h2 class="panel-title menu-title">Topic menu</h2>
        <nav id="nav" class="side-nav"></nav>
      </div>
    </aside>

    

    <aside class="side-panel right-panel">
      <div class="panel-card sticky-panel">
        <h2 class="panel-title">Overview</h2>
        <section class="stats" id="stats"></section>
      </div>
    </aside>
  </main>

  <script>
    const DATA = [
      {

        items: [

            name: "Azure Entra ID",

            remember: ["A tenant is an identity boundary.", "Authentication verifies who you are; authorization defines what you can do.", "A service principal is an application or automation identity.", "Managed identity removes the need to manually store and rotate secrets."],
            questions: ["What is the difference between Entra ID and Azure RBAC?", "What is a service principal and where is it used?", "Why is managed identity safer than a stored client secret?", "What does Conditional Access solve?"]

          {
            name: "Azure RBAC",

            what: "Role-Based Access Control defines permissions for Azure resources. Roles are assigned at a scope: management group, subscription, resource group or individual resource.",

            remember: ["Permissions are inherited down the scope hierarchy.", "Common built-in roles are Owner, Contributor, Reader and User Access Administrator.", "Custom roles allow more precise permissions.", "RBAC is not the same as network rules."],
            questions: ["How would you allow a pipeline to deploy only to one resource group?", "What is the difference between Owner and Contributor?", "What does least privilege mean?", "How does inheritance work in Azure RBAC?"]
          },
          {

            what: "The hierarchy used to organize Azure environments. Management groups contain subscriptions, a subscription is a billing and isolation boundary, and a resource group is a logical container for resources.",
            use: "Used for organizing environments, billing, policies, RBAC and resource lifecycle. Common patterns include separate dev, test and production subscriptions.",
            remember: ["A resource group has a region, but it can contain resources from multiple regions.", "Policy and RBAC can be applied higher in the hierarchy.", "Subscriptions have quotas and limits.", "Deleting a resource group deletes the resources inside it."],
            questions: ["When should environments be split into multiple subscriptions?", "What is a resource group and why is it important?", "What is the difference between a subscription and a tenant?", "How would you organize dev, test and production?"]
          },
          {
            name: "Azure Policy",
            type: "Governance",
            what: "A service for enforcing rules over Azure resources. It can audit or block unwanted configurations such as missing tags, disallowed regions or public IP usage.",
            use: "Used for compliance, standardization and guardrails. It helps teams deploy resources according to company rules.",
            remember: ["A policy can audit, deny or modify.", "An initiative is a group of policies.", "Policy is not a replacement for monitoring or RBAC.", "It works well with management groups."],
            questions: ["How would you require every resource to have an owner tag?", "What is the difference between Azure Policy and RBAC?", "What is a policy initiative?", "What happens when a deny policy is triggered?"]

          {

            use: "Used for isolation and traffic control. It is the foundation for hybrid connectivity, segmentation and private access to PaaS services.",
            remember: ["A subnet is part of a VNet address range.", "VNet peering connects Azure networks.", "CIDR ranges must not overlap when peering networks or connecting hybrid networks.", "NSG controls traffic at subnet or NIC level."],

          },
          {

          },
          {

          {

            use: "VPN is usually cheaper and faster to set up. ExpressRoute is used for higher stability, throughput and enterprise hybrid scenarios.",
            remember: ["VPN uses an IPsec tunnel.", "ExpressRoute is not an internet VPN.", "GatewaySubnet is a special subnet for the gateway.", "BGP is used for dynamic routing."],

          {

            remember: ["A VM needs an OS disk and NIC.", "Availability Sets and Zones improve availability.", "Managed disks simplify storage.", "Patching and hardening are the team's responsibility."],
            questions: ["When would you use a VM instead of App Service?", "How do you make VMs highly available?", "What is a managed disk?", "How do you restrict RDP or SSH access?"]
          },
          {
            name: "Virtual Machine Scale Sets",
            type: "Compute scaling",
            what: "A group of identical VM instances that can scale automatically based on rules or metrics.",
            use: "Used for horizontal scaling of VM-based applications, batch workers or backend pools behind load balancers.",
            remember: ["Autoscale can react to CPU, queue length or custom metrics.", "Instances use the same image or model.", "Rolling upgrades reduce downtime.", "VMSS is often combined with Load Balancer or Application Gateway."],

          {

          },
          {

          },
          {
            name: "Azure Kubernetes Service",

    let activeGroup = "All";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function list(items, cls = "") {
      return `<ul class="${cls}">${(items || []).map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function matches(item, group, query) {
      if (activeGroup !== "All" && activeGroup !== group) {
        return false;
      }

      const q = query.trim().toLowerCase();

      if (!q) {
        return true;
      }

      const haystack = [
        group,
        item.name,
        item.type,
        item.what,
        item.use,
        ...(item.remember || []),
        ...(item.questions || [])
      ].join(" ").toLowerCase();

      return haystack.includes(q);
    }

    function renderNav() {
      const nav = document.getElementById("nav");
      const groups = ["All", ...DATA.map(section => section.group), "Q & A"];

      nav.innerHTML = groups.map(group => `
        <button class="nav-btn ${group === activeGroup ? "active" : ""}" data-group="${escapeHtml(group)}">
          ${escapeHtml(group)}
        </button>
      `).join("");

      nav.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          const group = btn.dataset.group;

          if (group === "Q & A") {
            document.getElementById("my-questions").scrollIntoView({ behavior: "smooth" });
            return;
          }

          activeGroup = group;
          render();
          window.scrollTo({ top: document.querySelector("main").offsetTop - 10, behavior: "smooth" });
        });
      });
    }

    function renderStats(visibleCount) {
      const totalItems = DATA.reduce((sum, section) => sum + section.items.length, 0);
      const azure = DATA.find(x => x.group === "Azure")?.items.length || 0;
      const aws = DATA.find(x => x.group === "AWS")?.items.length || 0;

      document.getElementById("stats").innerHTML = `
        <div class="stat">
          <strong>${totalItems}</strong>
          <span>topics and services in the database</span>
        </div>
        <div class="stat">
          <strong>${azure}</strong>
          <span>Azure cards</span>
        </div>
        <div class="stat">
          <strong>${aws}</strong>
          <span>AWS cards</span>
        </div>
        <div class="stat">
          <strong>${visibleCount}</strong>
          <span>currently visible results</span>
        </div>
      `;
    }

    function renderCard(item) {
      const mode = document.getElementById("openMode").value;
      const openAttr = mode === "open" ? "open" : "";

      return `
        <details class="card" ${openAttr}>
          <summary>
            <div class="summary-row">
              <div class="title">
                <strong>${escapeHtml(item.name)}</strong>
                <span class="tagline">${escapeHtml(item.what)}</span>
              </div>
              <span class="badge">${escapeHtml(item.type)}</span>
            </div>
          </summary>

          <div class="content">
            <div class="block">
              <h3>What it does</h3>
              <p>${escapeHtml(item.what)}</p>
            </div>

            <div class="block">
              <h3>When it is used</h3>
              <p>${escapeHtml(item.use)}</p>
            </div>

            <div class="block">
              <h3>Remember</h3>
              ${list(item.remember)}
            </div>

            <div class="block">
              <h3>Possible interview questions</h3>
              ${list(item.questions, "questions")}
            </div>
          </div>
        </details>
      `;
    }

    function render() {
      renderNav();

      const query = document.getElementById("search").value;
      let visibleCount = 0;

      const html = DATA.map(section => {
        const visibleItems = section.items.filter(item => matches(item, section.group, query));
        visibleCount += visibleItems.length;

        if (!visibleItems.length) {
          return "";
        }

        return `
          <section class="section" id="${escapeHtml(section.group.toLowerCase().replaceAll(" ", "-"))}">
            <div class="section-head">
              <div>
                <h2>${escapeHtml(section.group)}</h2>
                <p class="section-desc">${escapeHtml(section.desc || "Key concepts, use cases, reminders and interview questions.")}</p>
              </div>
              <span class="badge">${visibleItems.length} items</span>
            </div>

            <div class="grid">
              ${visibleItems.map(renderCard).join("")}
            </div>
          </section>
        `;
      }).join("");

      document.getElementById("content").innerHTML = html || `
        <div class="empty">
          Nothing was found. Try another term, for example subnet, IAM, AKS, Terraform, DNS or Docker.
        </div>
      `;

      renderStats(visibleCount);
    }

    const STORAGE_KEY = "interview_questions_en_v1";

    function loadQuestions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveQuestions(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function renderQuestions() {
      const listEl = document.getElementById("questionList");
      const items = loadQuestions();

      if (!items.length) {
        listEl.innerHTML = `<div class="empty">You do not have any saved custom questions yet.</div>`;
        return;
      }

      listEl.innerHTML = items.map((item, index) => `
        <article class="saved-q">
          <header>
            <div>
              <h3>${escapeHtml(item.question)}</h3>
              <div class="meta">
                ${escapeHtml(item.area || "No area")} · ${escapeHtml(item.status)} · ${escapeHtml(item.date)}
              </div>
            </div>

            <button class="danger" data-delete="${index}">Delete</button>
          </header>

          <p>${escapeHtml(item.answer || "No note.")}</p>
        </article>
      `).join("");

      listEl.querySelectorAll("[data-delete]").forEach(btn => {
        btn.addEventListener("click", () => {
          const index = Number(btn.dataset.delete);
          const items = loadQuestions();
          items.splice(index, 1);
          saveQuestions(items);
          renderQuestions();
        });
      });
    }

    document.getElementById("addQuestion").addEventListener("click", () => {
      const area = document.getElementById("qArea").value.trim();
      const question = document.getElementById("qText").value.trim();
      const answer = document.getElementById("qAnswer").value.trim();
      const status = document.getElementById("qStatus").value;

      if (!question) {
        alert("Please enter an interview question.");
        return;
      }

      const items = loadQuestions();

      items.unshift({
        area,
        question,
        answer,
        status,
        date: new Date().toLocaleString("en-US")
      });

      saveQuestions(items);

      document.getElementById("qArea").value = "";
      document.getElementById("qText").value = "";
      document.getElementById("qAnswer").value = "";
      document.getElementById("qStatus").value = "Unknown";

      renderQuestions();
    });

    document.getElementById("exportQuestions").addEventListener("click", () => {
      const data = JSON.stringify(loadQuestions(), null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = "my-interview-questions.json";
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    });

    document.getElementById("clearQuestions").addEventListener("click", () => {
      if (!confirm("Do you really want to delete all custom questions?")) {
        return;
      }

      saveQuestions([]);
      renderQuestions();
    });

    document.getElementById("homeReset").addEventListener("click", () => {
      activeGroup = "All";
      document.getElementById("search").value = "";
      document.getElementById("openMode").value = "normal";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("openMode").addEventListener("change", render);

    render();
    renderQuestions();
  </script>
