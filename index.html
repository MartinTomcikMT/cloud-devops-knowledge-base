<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud / DevOps Knowledge Base</title>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #374151;
      --accent: #38bdf8;
      --accent2: #22c55e;
      --card: #020617;
      --code: #0b1220;
      --shadow: 0 14px 40px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(56,189,248,.13), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(34,197,94,.09), transparent 25%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .wrap {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
    }

    .hero {
      position: relative;
      min-height: 390px;
      display: flex;
      align-items: center;
      z-index: 1;
      padding: 50px 24px 40px;
      border-bottom: 1px solid rgba(56,189,248,.26);
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.46);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("./devops-hero2.png") right center / cover no-repeat;
      z-index: -1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 34%, rgba(56,189,248,.22), transparent 30%),
        radial-gradient(circle at 82% 28%, rgba(34,197,94,.13), transparent 26%),
        linear-gradient(180deg, transparent 0%, rgba(15,23,42,.94) 100%);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      margin: 0 0 12px;
    }

    .hero-title {
      padding: 0;
      border: 0;
      background: transparent;
      color: #e0f7ff;
      font-size: clamp(34px, 5.6vw, 76px);
      font-weight: 950;
      letter-spacing: -0.065em;
      line-height: .95;
      text-align: left;
      cursor: pointer;
      text-shadow:
        0 0 12px rgba(56,189,248,.64),
        0 0 34px rgba(56,189,248,.38),
        0 0 76px rgba(34,197,94,.18);
    }

    .hero-title:hover {
      color: #ffffff;
      filter: drop-shadow(0 0 18px rgba(56,189,248,.48));
    }

    .hero-subtitle {
      margin: 0;
      max-width: 920px;
      color: #dbeafe;
      font-size: clamp(15px, 1.5vw, 18px);
      text-shadow: 0 1px 16px rgba(0,0,0,.8);
    }

    main.app-layout {
      padding: 24px 0 64px;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 230px;
      gap: 18px;
      align-items: start;
    }

    .side-panel,
    .center-panel {
      min-width: 0;
    }

    .panel-card {
      border: 1px solid var(--line);
      background: rgba(17,24,39,.86);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .sticky-panel {
      position: sticky;
      top: 18px;
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 14px;
      color: #bfdbfe;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .menu-title {
      margin-top: 18px;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,.14);
    }

    button {
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 14px;
      transition: .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .left-panel input,
    .left-panel select {
      margin-bottom: 10px;
    }

    .side-nav {
      margin: 0;
      display: grid;
      gap: 7px;
      padding-top: 0;
      border-top: 0;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 9px 11px;
      border-radius: 11px;
      color: var(--muted);
      background: rgba(31,41,55,.75);
    }

    .nav-btn.active {
      color: #02131f;
      background: linear-gradient(135deg, #38bdf8, #22c55e);
      border-color: transparent;
      font-weight: 850;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 0;
    }

    .stat {
      border: 1px solid var(--line);
      background: rgba(2,6,23,.62);
      border-radius: 15px;
      padding: 13px;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: white;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      margin: 0 0 28px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -0.02em;
    }

    .section-desc {
      margin: 4px 0 0;
      color: var(--muted);
      max-width: 850px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    details.card {
      border: 1px solid var(--line);
      background: rgba(2,6,23,.78);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    details.card[open] {
      border-color: rgba(56,189,248,.55);
    }

    summary {
      list-style: none;
      cursor: pointer;
      padding: 15px 16px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .title strong {
      font-size: 17px;
    }

    .tagline {
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      white-space: nowrap;
      font-size: 12px;
      color: #bae6fd;
      border: 1px solid rgba(56,189,248,.35);
      background: rgba(56,189,248,.08);
      padding: 5px 9px;
      border-radius: 999px;
    }

    .content {
      border-top: 1px solid var(--line);
      padding: 15px 16px 17px;
      background: rgba(15,23,42,.56);
    }

    .block {
      margin: 0 0 15px;
    }

    .block h3 {
      margin: 0 0 7px;
      font-size: 14px;
      color: #bfdbfe;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .block p {
      margin: 0;
      color: #d1d5db;
    }

    ul {
      margin: 8px 0 0 20px;
      padding: 0;
    }

    li {
      margin: 5px 0;
    }

    code {
      background: var(--code);
      color: #a7f3d0;
      border: 1px solid rgba(167,243,208,.18);
      border-radius: 6px;
      padding: 2px 5px;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
    }

    .questions li {
      color: #fef3c7;
    }

    .empty {
      color: var(--muted);
      padding: 16px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      text-align: center;
    }

    @media (max-width: 1180px) {
      .app-layout {
        grid-template-columns: 230px minmax(0, 1fr);
      }

      .right-panel {
        display: none;
      }
    }

    @media (max-width: 820px) {
      .hero {
        min-height: 300px;
        padding: 38px 18px 32px;
        background-position: 63% center;
      }

      .app-layout {
        grid-template-columns: 1fr;
      }

      .sticky-panel {
        position: static;
      }

      .side-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-btn {
        width: auto;
        text-align: center;
        border-radius: 999px;
      }

      .right-panel {
        display: block;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .summary-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .badge {
        white-space: normal;
      }
    }

    @media print {
      body {
        background: white;
        color: black;
      }

      .hero,
      .left-panel,
      .right-panel {
        display: none;
      }

      .app-layout {
        display: block;
      }

      details.card {
        break-inside: avoid;
        border-color: #bbb;
        background: white;
        box-shadow: none;
      }

      details.card:not([open]) .content {
        display: block;
      }

      .content {
        background: white;
      }

      .badge,
      .tagline,
      .section-desc {
        color: #333;
      }
    }
  </style>
</head>

<body>
  <header class="hero">
    <div class="hero-overlay"></div>

    <div class="wrap hero-inner">
      <h1>
        <button id="homeReset" class="hero-title">
          Cloud / DevOps <br>Knowledge Base
        </button>
      </h1>

      <p class="hero-subtitle">
        Overview for Azure, AWS, CI/CD, Terraform, Kubernetes, Docker,<br>
        Windows, Linux, Networking, Git and common DevOps topics.
      </p>
    </div>
  </header>

  <main class="wrap app-layout">
    <aside class="side-panel left-panel">
      <div class="panel-card sticky-panel">
        <h2 class="panel-title">Search</h2>

        <input id="search" placeholder="Search for AKS, IAM, subnet, Dockerfile..." />

        <select id="openMode">
          <option value="normal">Clickable cards</option>
          <option value="open">Open all</option>
          <option value="closed">Close all</option>
        </select>

        <h2 class="panel-title menu-title">Topic menu</h2>
        <nav id="nav" class="side-nav"></nav>
      </div>
    </aside>

    <section class="center-panel">
      <div id="content"></div>
    </section>

    <aside class="side-panel right-panel">
      <div class="panel-card sticky-panel">
        <h2 class="panel-title">Overview</h2>
        <section class="stats" id="stats"></section>
      </div>
    </aside>
  </main>

  <script>
    const DATA = [
      {
        group: "Azure",
        items: [
          {
            name: "Azure Entra ID",
            type: "Identity",
            what: "A cloud identity provider for users, groups, applications and service principals. It handles sign-in, SSO, MFA, Conditional Access and identities outside virtual machines or servers.",
            use: "Used to control who or what can authenticate to Azure and enterprise applications. It is the foundation for app registrations, service principals and managed identities.",
            remember: [
              "A tenant is an identity boundary.",
              "Authentication verifies who you are; authorization defines what you can do.",
              "A service principal is an application or automation identity.",
              "Managed identity removes the need to manually store and rotate secrets."
            ],
            questions: [
              "What is the difference between Entra ID and Azure RBAC?",
              "What is a service principal and where is it used?",
              "Why is managed identity safer than a stored client secret?",
              "What does Conditional Access solve?"
            ]
          },
          {
            name: "Azure RBAC",
            type: "Access control",
            what: "Role-Based Access Control defines permissions for Azure resources. Roles are assigned at a scope such as management group, subscription, resource group or individual resource.",
            use: "Used to apply least privilege. For example, a developer can be Reader in production, Contributor in a dev resource group and a pipeline can deploy only to a specific resource group.",
            remember: [
              "Permissions are inherited down the scope hierarchy.",
              "Common built-in roles are Owner, Contributor, Reader and User Access Administrator.",
              "Custom roles allow more precise permissions.",
              "RBAC is not the same as network rules."
            ],
            questions: [
              "How would you allow a pipeline to deploy only to one resource group?",
              "What is the difference between Owner and Contributor?",
              "What does least privilege mean?",
              "How does inheritance work in Azure RBAC?"
            ]
          },
          {
            name: "Management Groups / Subscriptions / Resource Groups",
            type: "Governance",
            what: "The hierarchy used to organize Azure environments. Management groups contain subscriptions, a subscription is a billing and isolation boundary, and a resource group is a logical container for resources.",
            use: "Used for organizing environments, billing, policies, RBAC and resource lifecycle. Common patterns include separate dev, test and production subscriptions.",
            remember: [
              "A resource group has a region, but it can contain resources from multiple regions.",
              "Policy and RBAC can be applied higher in the hierarchy.",
              "Subscriptions have quotas and limits.",
              "Deleting a resource group deletes the resources inside it."
            ],
            questions: [
              "When should environments be split into multiple subscriptions?",
              "What is a resource group and why is it important?",
              "What is the difference between a subscription and a tenant?",
              "How would you organize dev, test and production?"
            ]
          },
          {
            name: "Azure Policy",
            type: "Governance",
            what: "A service for enforcing rules over Azure resources. It can audit or block unwanted configurations such as missing tags, disallowed regions or public IP usage.",
            use: "Used for compliance, standardization and guardrails. It helps teams deploy resources according to company rules.",
            remember: [
              "A policy can audit, deny or modify.",
              "An initiative is a group of policies.",
              "Policy is not a replacement for monitoring or RBAC.",
              "It works well with management groups."
            ],
            questions: [
              "How would you require every resource to have an owner tag?",
              "What is the difference between Azure Policy and RBAC?",
              "What is a policy initiative?",
              "What happens when a deny policy is triggered?"
            ]
          },
          {
            name: "Azure Virtual Network",
            type: "Networking",
            what: "A private network in Azure. It contains address spaces, subnets, route tables, DNS settings and connects resources such as VMs, AKS and private endpoints.",
            use: "Used for isolation and traffic control. It is the foundation for hybrid connectivity, segmentation and private access to PaaS services.",
            remember: [
              "A subnet is part of a VNet address range.",
              "VNet peering connects Azure networks.",
              "CIDR ranges must not overlap when peering networks or connecting hybrid networks.",
              "NSG controls traffic at subnet or NIC level."
            ],
            questions: [
              "What is a subnet and why is it used?",
              "How do you connect two VNets?",
              "Why is overlapping CIDR a problem?",
              "What is the difference between a VNet and a subnet?"
            ]
          },
          {
            name: "Network Security Group",
            type: "Networking",
            what: "An NSG is a stateful firewall rule set for inbound and outbound traffic at subnet or network interface level.",
            use: "Used to allow or block traffic between subnets, virtual machines and the internet. A common use case is limiting SSH or RDP only to an admin network.",
            remember: [
              "Rules have priorities; lower numbers win.",
              "NSG is stateful, so return traffic for an allowed connection is automatically allowed.",
              "Default rules always exist.",
              "NSG is not a Layer 7 firewall."
            ],
            questions: [
              "How would you allow SSH only from one IP address?",
              "What does priority mean in NSG rules?",
              "What is the difference between NSG and Azure Firewall?",
              "Is NSG stateful or stateless?"
            ]
          },
          {
            name: "Azure Firewall",
            type: "Security / Networking",
            what: "A managed network firewall for centralized protection. It supports network rules, application rules, NAT rules, threat intelligence and logging.",
            use: "Used in hub-and-spoke architectures for ingress and egress control, centralized logging and security rules.",
            remember: [
              "It is useful for centralized traffic control.",
              "It supports FQDN rules for outbound HTTP/S.",
              "It is often combined with route tables.",
              "It is not the same as NSG."
            ],
            questions: [
              "When would you use Azure Firewall instead of NSG?",
              "What is a hub-and-spoke network architecture?",
              "How do you force subnet traffic through a firewall?",
              "What are application rules?"
            ]
          },
          {
            name: "Private Link / Private Endpoint / Private DNS",
            type: "Private access",
            what: "A Private Endpoint gives a PaaS service a private IP address inside a VNet. Private Link enables private access to a service without using the public internet.",
            use: "Used when services such as Storage, SQL or Key Vault should not be publicly reachable.",
            remember: [
              "A private endpoint is a network interface with a private IP.",
              "DNS is critical; otherwise clients may still resolve the public endpoint.",
              "Public network access is often disabled.",
              "NSG and routing behavior depends on service configuration."
            ],
            questions: [
              "Why must DNS be handled after creating a private endpoint?",
              "How do you disable public access to a Storage Account?",
              "What is the difference between service endpoint and private endpoint?",
              "What is Private Link?"
            ]
          },
          {
            name: "Azure Kubernetes Service",
            type: "Kubernetes",
            what: "A managed Kubernetes cluster in Azure. Azure manages the control plane, while you manage node pools, workloads, networking, security and add-ons.",
            use: "Used for containerized microservices, complex deployments, autoscaling and cloud-native applications.",
            remember: [
              "A node pool is a group of worker nodes.",
              "AKS can use Azure CNI or kubenet.",
              "Ingress Controller handles HTTP/S entry.",
              "Integration with ACR, Entra ID, Monitor and Key Vault is common."
            ],
            questions: [
              "What does Azure manage in AKS and what do you manage?",
              "What is the difference between pod, deployment and service?",
              "How do you connect AKS to ACR?",
              "How would you troubleshoot CrashLoopBackOff?"
            ]
          },
          {
            name: "Azure App Service",
            type: "PaaS compute",
            what: "A managed platform for hosting web applications and APIs without managing servers. It supports deployment slots, autoscale, custom domains and TLS.",
            use: "Used for websites and APIs when you want less infrastructure management than with VMs.",
            remember: [
              "The App Service Plan defines compute capacity.",
              "Deployment slots enable blue/green style swaps.",
              "Runtime can be .NET, Java, Node.js, Python, PHP or a container.",
              "Scaling happens at the plan level."
            ],
            questions: [
              "What is an App Service Plan?",
              "What are deployment slots used for?",
              "When would you use App Service instead of AKS?",
              "How are custom domains and TLS handled?"
            ]
          },
          {
            name: "Azure Functions",
            type: "Serverless",
            what: "Serverless compute for event-driven code. A function is triggered by events such as an HTTP request, timer, queue message or event stream.",
            use: "Used for small integration tasks, automation, event processing and background jobs without managing servers.",
            remember: [
              "A trigger starts a function; a binding connects inputs or outputs.",
              "Consumption plan scales automatically but may have cold starts.",
              "Durable Functions support orchestration of longer workflows.",
              "It is not ideal for long-running monoliths."
            ],
            questions: [
              "What are triggers and bindings?",
              "What is a cold start?",
              "When would you use Azure Functions?",
              "What is the difference between Functions and App Service?"
            ]
          },
          {
            name: "Azure Container Registry",
            type: "Container registry",
            what: "A private registry for Docker and OCI images and Helm charts. It is where AKS, Container Apps or pipelines pull container images from.",
            use: "Used in CI/CD flows: build image, push to ACR and deploy to a runtime environment.",
            remember: [
              "It supports private registries.",
              "AKS can pull images using managed identity.",
              "Image tags should be controlled, for example with a commit SHA.",
              "ACR Tasks can build images."
            ],
            questions: [
              "What is a container registry used for?",
              "How do you secure image pulls from AKS?",
              "Why should you avoid always using the latest tag?",
              "What is an immutable image tag?"
            ]
          },
          {
            name: "Azure Key Vault",
            type: "Secrets",
            what: "A service for securely storing secrets, keys and certificates. It integrates with managed identities and access auditing.",
            use: "Used for connection strings, API keys, certificates and encryption keys without storing secrets in source code or plaintext pipeline variables.",
            remember: [
              "Secrets are values, keys are cryptographic keys and certificates are certificates.",
              "Access can be controlled through RBAC or access policies.",
              "Soft delete and purge protection protect against accidental deletion.",
              "Applications should ideally access it through managed identity."
            ],
            questions: [
              "Why should secrets not be stored in Git?",
              "How can an application safely read a secret from Key Vault?",
              "What is the difference between a secret and a key?",
              "What is purge protection?"
            ]
          },
          {
            name: "Azure Monitor / Log Analytics / Application Insights",
            type: "Monitoring",
            what: "Azure Monitor collects metrics and logs. Log Analytics provides KQL queries. Application Insights monitors applications, requests, dependencies and exceptions.",
            use: "Used for observability, alerting, troubleshooting, performance analysis and audit.",
            remember: [
              "Metrics are numeric time series.",
              "Logs are detailed events and records.",
              "KQL is the query language for logs.",
              "Alerts can react to metrics or log queries."
            ],
            questions: [
              "What is the difference between metrics and logs?",
              "What is Application Insights used for?",
              "What is KQL?",
              "How would you investigate an API latency incident?"
            ]
          },
          {
            name: "Azure DevOps / Pipelines",
            type: "CI/CD",
            what: "A platform for repos, boards, pipelines, artifacts and test plans. Azure Pipelines automates build, test and deployment.",
            use: "Used for CI/CD of applications and infrastructure. YAML pipelines define build, test and deploy steps as code.",
            remember: [
              "A pipeline agent runs jobs.",
              "A stage can represent dev, test or production.",
              "A service connection gives a pipeline access to the cloud.",
              "Secrets belong in variable groups, Key Vault or secure storage."
            ],
            questions: [
              "What is the difference between CI and CD?",
              "What is a service connection?",
              "How would you deploy Terraform through a pipeline?",
              "How do you protect secrets in a pipeline?"
            ]
          }
        ]
      },
      {
        group: "AWS",
        items: [
          {
            name: "IAM",
            type: "Identity",
            what: "Identity and Access Management controls users, groups, roles, policies and permissions in AWS. It is the security foundation of every AWS account.",
            use: "Used to grant permissions to people, applications, EC2 instances, Lambda functions or CI/CD pipelines.",
            remember: [
              "A policy is a JSON document with Allow or Deny statements.",
              "A role is assumed and uses temporary credentials.",
              "Explicit Deny takes precedence.",
              "The root account should not be used for daily work."
            ],
            questions: [
              "What is the difference between an IAM user and an IAM role?",
              "What is least privilege?",
              "How does AssumeRole work?",
              "Why is the root account risky?"

          },
          {
            name: "AWS Organizations / Accounts",
            type: "Governance",
            what: "A service for managing multiple AWS accounts. It supports organizational units, consolidated billing and Service Control Policies.",
            use: "Used to separate dev, test, production, teams, security accounts and centralized enterprise rules.",
            remember: [
              "An account is a strong isolation boundary.",
              "SCP limits the maximum allowed permissions.",
              "The management account must be protected.",

            ],
            questions: [
              "Why use multiple AWS accounts?",
              "What is an SCP?",
              "What is the difference between an IAM policy and an SCP?",
              "How would you separate production from development?"
            ]
          },
          {
            name: "VPC",
            type: "Networking",
            what: "Virtual Private Cloud is an isolated virtual network in AWS. It contains CIDR ranges, subnets, route tables, gateways, endpoints and security controls.",
            use: "Used for network isolation and traffic control between EC2, RDS, EKS, the internet and on-premises networks.",
            remember: [
              "A subnet is tied to an Availability Zone.",
              "A public subnet has a route to an Internet Gateway.",
              "A private subnet has no direct inbound internet access.",
              "CIDR planning should be done in advance."
            ],

              "An agent runs jobs.",
              "Plugins extend functionality.",
              "The Jenkins server requires maintenance, security and updates."
            ],
            questions: [
              "What is Jenkinsfile?",
              "What is the difference between controller and agent?",
              "How does Jenkins handle secrets?",
              "What are the pros and cons of self-hosted CI/CD?"
            ]
          },
          {
            name: "Ansible",
            type: "Configuration management",
            what: "Ansible is an automation and configuration management tool.",
            use: "Used for server configuration, package installation, service management and repeatable administration.",
            remember: [
              "Inventory contains hosts.",
              "A playbook describes tasks.",
              "A module performs a specific action.",
              "Idempotency means repeated runs make no change when the desired state is already met."
            ],
            questions: [
              "What is an Ansible playbook?",
              "What does idempotency mean?",
              "What is the difference between Ansible and Terraform?",
              "What is inventory used for?"
            ]
          }
        ]
      }
    ];

    let activeGroup = "All";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function list(items, cls = "") {
      return `<ul class="${cls}">${(items || []).map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function matches(item, group, query) {
      if (activeGroup !== "All" && activeGroup !== group) {
        return false;
      }

      const q = query.trim().toLowerCase();

      if (!q) {
        return true;
      }

      const haystack = [
        group,
        item.name,
        item.type,
        item.what,
        item.use,
        ...(item.remember || []),
        ...(item.questions || [])
      ].join(" ").toLowerCase();

      return haystack.includes(q);
    }

    function renderNav() {
      const nav = document.getElementById("nav");
      const groups = ["All", ...DATA.map(section => section.group)];

      nav.innerHTML = groups.map(group => `
        <button class="nav-btn ${group === activeGroup ? "active" : ""}" data-group="${escapeHtml(group)}">
          ${escapeHtml(group)}
        </button>
      `).join("");

      nav.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          activeGroup = btn.dataset.group;
          render();
          window.scrollTo({
            top: document.querySelector("main").offsetTop - 10,
            behavior: "smooth"
          });
        });
      });
    }

    function renderStats(visibleCount) {
      const totalItems = DATA.reduce((sum, section) => sum + section.items.length, 0);
      const azure = DATA.find(x => x.group === "Azure")?.items.length || 0;
      const aws = DATA.find(x => x.group === "AWS")?.items.length || 0;

      document.getElementById("stats").innerHTML = `
        <div class="stat">
          <strong>${totalItems}</strong>
          <span>topics and services in the database</span>
        </div>
        <div class="stat">
          <strong>${azure}</strong>
          <span>Azure cards</span>
        </div>
        <div class="stat">
          <strong>${aws}</strong>
          <span>AWS cards</span>
        </div>
        <div class="stat">
          <strong>${visibleCount}</strong>
          <span>currently visible results</span>
        </div>
      `;
    }

    function renderCard(item) {
      const mode = document.getElementById("openMode").value;
      const openAttr = mode === "open" ? "open" : "";

      return `
        <details class="card" ${openAttr}>
          <summary>
            <div class="summary-row">
              <div class="title">
                <strong>${escapeHtml(item.name)}</strong>
                <span class="tagline">${escapeHtml(item.what)}</span>
              </div>
              <span class="badge">${escapeHtml(item.type)}</span>
            </div>
          </summary>

          <div class="content">
            <div class="block">
              <h3>What it does</h3>
              <p>${escapeHtml(item.what)}</p>
            </div>

            <div class="block">
              <h3>When it is used</h3>
              <p>${escapeHtml(item.use)}</p>
            </div>

            <div class="block">
              <h3>Remember</h3>
              ${list(item.remember)}
            </div>

            <div class="block">
              <h3>Possible interview questions</h3>
              ${list(item.questions, "questions")}
            </div>
          </div>
        </details>
      `;
    }

    function render() {
      renderNav();

      const query = document.getElementById("search").value;
      let visibleCount = 0;

      const html = DATA.map(section => {
        const visibleItems = section.items.filter(item => matches(item, section.group, query));
        visibleCount += visibleItems.length;

        if (!visibleItems.length) {
          return "";
        }

        return `
          <section class="section" id="${escapeHtml(section.group.toLowerCase().replaceAll(" ", "-"))}">
            <div class="section-head">
              <div>
                <h2>${escapeHtml(section.group)}</h2>
                <p class="section-desc">${escapeHtml(section.desc || "Key concepts, use cases, reminders and interview questions.")}</p>
              </div>
              <span class="badge">${visibleItems.length} items</span>
            </div>

            <div class="grid">
              ${visibleItems.map(renderCard).join("")}
            </div>
          </section>
        `;
      }).join("");

      document.getElementById("content").innerHTML = html || `
        <div class="empty">
          Nothing was found. Try another term, for example subnet, IAM, AKS, Terraform, DNS or Docker.
        </div>
      `;

      renderStats(visibleCount);
    }

    document.getElementById("homeReset").addEventListener("click", () => {
      activeGroup = "All";57
      document.getElementById("search").value = "";
      document.getElementById("openMode").value = "normal";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("openMode").addEventListener("change", render);

    render();
  </script>
</body>
</html>
